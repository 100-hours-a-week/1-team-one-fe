name: Deploy to Dev Instance (SSM)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: '배포 환경 (dev)'
      image_uri:
        required: true
        type: string
        description: '배포할 Docker 이미지 URI'
      instance_tag_name:
        required: true
        type: string
        description: 'EC2 인스턴스 태그 Key (예: Environment)'
      instance_tag_value:
        required: true
        type: string
        description: 'EC2 인스턴스 태그 Value (예: dev)'
      # 알림용 메타데이터
      pr_number:
        required: true
        type: string
      pr_title:
        required: true
        type: string
      base_ref:
        required: true
        type: string
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
      run_id:
        required: true
        type: string

    secrets:
      DISCORD_WEBHOOK_URL:
        required: true
      DISCORD_ROLE_FRONTEND:
        required: true
      DISCORD_ROLE_FRONTEND_ONCALL:
        required: true
      AWS_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy-ssm:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. 태그를 이용해 Dev EC2 인스턴스 ID 찾기
      - name: Find Target Instance
        id: find-instance
        run: |
          echo "Finding instance with tag ${{ inputs.instance_tag_name }}=${{ inputs.instance_tag_value }}..."
          
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:${{ inputs.instance_tag_name }},Values=${{ inputs.instance_tag_value }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "Error: No running Dev instance found!"
            exit 1
          fi
          
          echo "Found Instance ID: $INSTANCE_ID"
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_OUTPUT

      # 2. SSM으로 배포 스크립트 전송 및 실행
      - name: Deploy via SSM Send-Command
        id: ssm-deploy
        env:
          INSTANCE_ID: ${{ steps.find-instance.outputs.INSTANCE_ID }}
          IMAGE_URI: ${{ inputs.image_uri }}
        run: |
          echo "Sending deployment command to $INSTANCE_ID..."
          
          # SSM 스크립트 작성
          cat <<EOF > deploy.sh
          #!/bin/bash
          exec > >(tee /var/log/deploy.log|logger -t deploy -s 2>/dev/console) 2>&1
          
          echo "Starting Deployment..."

          mkdir -p /home/ubuntu/app
          cd /home/ubuntu/app

          ECR_REGISTRY=\$(echo $IMAGE_URI | cut -d/ -f1)
          export ECR_REGISTRY=\$ECR_REGISTRY

          # 0. 현재 실행 중인 컨테이너 확인 및 백업
          CURRENT_CONTAINER_ID=\$(docker ps -q -f name=frontend)
          
          if [ ! -z "\$CURRENT_CONTAINER_ID" ]; then
            echo "Found running container. Backing up current image..."
            # 현재 돌고 있는 이미지 ID 추출
            CURRENT_IMAGE_ID=\$(docker inspect --format='{{.Image}}' \$CURRENT_CONTAINER_ID)
            # 롤백용 태그 달기 (강제 덮어쓰기)
            docker tag \$CURRENT_IMAGE_ID frontend:rollback-frontend
            echo "Backup created: frontend:rollback-frontend (\$CURRENT_IMAGE_ID)"
          else
            echo "No running container found. Skipping backup."
          fi
          
          # 1. ECR 로그인
          aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin \$ECR_REGISTRY
          
          # 2. 이미지 Pull
          docker compose pull frontend || { echo "Docker pull failed!"; exit 1; }
          
          # 3. 컨테이너 Restart
          docker compose up -d frontend

          # 4. Health Check & Verification
          echo "Health Check & Verification"
          echo "Waiting for Frontend to be ready..."
          
          IS_HEALTHY=false
          FOR_LIMIT=12

          for i in \$(seq \$FOR_LIMIT); do
            if [ -z "\$(docker compose ps -q frontend)" ]; then
              echo "Container is not running!"
              docker compose logs frontend --tail 20
              break
            fi

            if curl -s -f http://localhost:3000/ > /dev/null; then
              echo "Health Check Passed! Deployment Complete."
              IS_HEALTHY=true
              break
            fi

            echo "App is starting ... (\$i/\${FOR_LIMIT})"
            sleep 5
          done

          # 5. 결과 처리 및 롤백
          if [ "\$IS_HEALTHY" = "true" ]; then
            echo "Deployment Configured Successfully."
            docker rmi frontend:rollback-frontend 2>/dev/null || true
            docker image prune -f
            exit 0
          else
            echo "Health Check Failed! Initiation Rollback..."

            echo "=== Error Logs ==="
            docker compose logs frontend --tail 50

            # 롤백 실행
            if docker image inspect frontend:rollback-frontend >/dev/null 2>&1; then
              echo "Restoring previous image..."
              docker tag frontend:rollback-frontend \$ECR_REGISTRY/frontend:dev-latest
              docker compose up -d --force-recreate frontend
              echo "Rollback Complete. Server is running on previous version."
            else
              echo "No backup image found. Cannot rollback."
            fi
            exit 1
          fi
          EOF
          
          ENCODED_SCRIPT=$(cat deploy.sh | base64 -w 0)
          
          # SSM 명령 전송
          SH_COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=$INSTANCE_ID" \
            --comment "Deploying frontend to Dev" \
            --parameters commands="echo $ENCODED_SCRIPT | base64 -d > /tmp/deploy.sh && bash /tmp/deploy.sh" \
            --query "Command.CommandId" \
            --output text)
            
          echo "SSM Command Sent! Command ID: $SH_COMMAND_ID"
          echo "COMMAND_ID=$SH_COMMAND_ID" >> $GITHUB_OUTPUT

      # 3. SSM 명령 실행 완료 대기 (Polling)
      - name: Wait for Deployment to Finish
        run: |
          CMD_ID=${{ steps.ssm-deploy.outputs.COMMAND_ID }}
          INSTANCE_ID=${{ steps.find-instance.outputs.INSTANCE_ID }}
          
          echo "Waiting for command $CMD_ID on $INSTANCE_ID to complete..."
          
          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $CMD_ID \
              --instance-id $INSTANCE_ID \
              --query "Status" \
              --output text)
            
            echo "Current Status: $STATUS"
            
            if [[ "$STATUS" == "Success" ]]; then
              echo "Deployment Successful!"
              # 로그 출력
              aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query "StandardOutputContent" --output text
              break
            elif [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" ]]; then
              echo "Deployment Failed!"
              # 에러 로그 출력
              aws ssm get-command-invocation --command-id $CMD_ID --instance-id $INSTANCE_ID --query "StandardErrorContent" --output text
              exit 1
            fi
            
            sleep 5
          done

            # 현재 시간 구하기 (KST)
      - name: Get Current Time
        if: always()
        uses: 1466587594/get-current-time@v2
        id: current-time
        with:
          format: 'YYYY-MM-DD HH:mm:ss'
          utcOffset: '+09:00' # 한국 시간
          timezone: 'Asia/Seoul'

      # Discord 성공 알림
      - name: Discord Notification - Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "✅ ${{ inputs.environment }} FE 배포(CD) 성공", 
              "color": 5763719,
              "fields": [
                {"name": "Repository", "value": "${{ inputs.repository }}", "inline": false},
                {"name": "Environment", "value": "${{ inputs.environment }}", "inline": true},
                {"name": "Merge To", "value": "${{ inputs.base_ref }}", "inline": true},
                {"name": "Triggered By", "value": "${{ inputs.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ inputs.pr_title }}", "inline": false},
                {"name": "Version", "value": "${{ env.DEPLOY_TAG || 'N/A' }}", "inline": true},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: 'v2 ${{ inputs.environment }} FE 배포 완료! <@&${{ secrets.DISCORD_ROLE_FRONTEND }}>'

      # Discord 실패 알림
      - name: Discord Notification - Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "🚨 ${{ inputs.environment }} FE 배포(CD) 실패",
              "color": 15548997,
              "fields": [
                {"name": "Repository", "value": "${{ inputs.repository }}", "inline": false},
                {"name": "Environment", "value": "${{ inputs.environment }}", "inline": true},
                {"name": "Merge To", "value": "${{ inputs.base_ref }}", "inline": true},
                {"name": "Triggered By", "value": "${{ inputs.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ inputs.pr_title }}", "inline": false},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ inputs.repository }}/actions/runs/${{ inputs.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: 'v2 ${{ inputs.environment }} FE 배포 실패! 로그 확인 필요 <@&${{ secrets.DISCORD_ROLE_FRONTEND_ONCALL }}>'
