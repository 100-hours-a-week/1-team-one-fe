name: Frontend CI/CD with Docker

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches: [develop, main]

permissions:
  id-token: write # AWS OIDC 인증용
  contents: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: frontend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. 변경 사항 감지 (불필요한 빌드 방지)
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              # 핵심 애플리케이션 코드
              - "apps/web/**"
              - "packages/**"

              # 의존성 관리
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

              # 빌드 설정
              - "turbo.json"
              - "tooling/**"
              - "eslint.config.mjs"

              # 패키지 관리자 설정
              - ".npmrc"

              # CI/CD 워크플로우
              - ".github/workflows/frontend-ci-cd.yml"

  # 2. CI: 빌드 및 도커 이미지 푸시 (Dev/Staging 용)
  # PR이 열리거나 업데이트될 때 실행됨
  build-and-push:
    needs: check-changes
    if: (github.event.action == 'opened' || github.event.action == 'synchronize') && needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm & Node 설정 (빌드 캐시용 아님, Sentry CLI 및 스크립트 실행용)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.13.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Turbo 빌드 캐시 복원  
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Next.js 빌드 캐시 복원
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{js,ts,jsx,tsx}', 'packages/**/*.{js,ts,jsx,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-


      # AWS 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 환경 변수 불러오기
      - name: Export web env
        shell: bash
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "Building for STAGING environment..."
            echo "${{ secrets.WEB_ENV_STAGING_V2 }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_RELEASE=raisedev-web@staging-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            echo "SENTRY_PROJECT=raisedev-staging" >> "$GITHUB_ENV"
          else
            echo "Building for DEV environment..."
            echo "${{ secrets.WEB_ENV_DEV_V2 }}" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_RELEASE=raisedev-web@dev-${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            echo "SENTRY_PROJECT=raisedev-dev" >> "$GITHUB_ENV"
          fi

      # Sentry Release 생성 (소스맵 업로드 준비)
      # - name: Create Sentry Release
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      #   run: |
      #     npm install -g @sentry/cli
      #     sentry-cli releases new "$NEXT_PUBLIC_RELEASE"
      #     # 조직 레포에 권한이 없어서 CI가 터지는 것을 방지하기 위해서 || true 추가
      #     sentry-cli releases set-commits "$NEXT_PUBLIC_RELEASE" --auto || true

      # Next.js 빌드
      - name: Build Next.js application
        run: pnpm turbo build --filter=web

      # Sentry Finalize
      # - name: Finalize Sentry Release
      #   if: success()
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      #   run: sentry-cli releases finalize "$NEXT_PUBLIC_RELEASE"

      # 모노레포 경로 처리
      - name: Bundle Artifacts
        working-directory: apps/web
        run: |
          STANDALONE_ROOT=".next/standalone"

          # 모노레포 중첩 구조 찾기
          if [ -d "$STANDALONE_ROOT/1-team-one-fe/apps/web" ]; then
            APP_DIR="$STANDALONE_ROOT/1-team-one-fe/apps/web"
          elif [ -d "$STANDALONE_ROOT/apps/web" ]; then
            APP_DIR="$STANDALONE_ROOT/apps/web"
          else
            echo "ERROR: Cannot find standalone app directory"
            ls -la $STANDALONE_ROOT
            exit 1
          fi

          mkdir -p $APP_DIR/.next
          cp -r .next/static $APP_DIR/.next/
          cp -r public $APP_DIR/

          cp ../../Dockerfile $STANDALONE_ROOT/Dockerfile

          # 만약 CI에서 만든 .env 파일이 있다면 주석 해제해서 폴더 루트에 포함시키기
          # cp ../../.env $STANDALONE_ROOT/.env

      # 도커 이미지 빌드 및 푸시
      - name: Build and Push Docker Image
        id: build-image
        working-directory: apps/web/.next/standalone
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # main 브랜치 PR이면 staging 태그, dev 브랜치 PR이면 dev 태그
          if [[ "${{ github.base_ref }}" == "main" ]]; then
             TAG_PREFIX="staging-pr"
             LATEST_TAG="staging-latest"
          else
             TAG_PREFIX="dev-pr"
             LATEST_TAG="dev-latest"
          fi
          
          IMAGE_TAG="$TAG_PREFIX-$PR_HEAD_SHA"

          # Docker Build 
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG

      # 현재 시간 구하기 (KST)
      - name: Get Current Time
        if: always()
        uses: 1466587594/get-current-time@v2
        id: current-time
        with:
          format: "YYYY-MM-DD HH:mm:ss"
          utcOffset: "+09:00" # 한국 시간
          timezone: "Asia/Seoul"

      # Discord 성공 알림
      - name: Discord Notification - Success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "✅ FE CI 성공",
              "color": 5763719,
              "fields": [
                {"name": "Repository", "value": "${{ github.repository }}", "inline": false},
                {"name": "Merge To", "value": "${{ github.base_ref }}", "inline": false},
                {"name": "Triggered By", "value": "${{ github.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ github.event.pull_request.title }}", "inline": false},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: "v2 CI 파이프라인이 성공적으로 완료되었습니다. <@&${{ secrets.DISCORD_ROLE_FRONTEND }}>"

      # Discord 실패 알림
      - name: Discord Notification - Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_EMBEDS: |
            [{
              "title": "🚨 FE CI 실패",
              "color": 15548997,
              "fields": [
                {"name": "Repository", "value": "${{ github.repository }}", "inline": false},
                {"name": "Merge To", "value": "${{ github.base_ref }}", "inline": false},
                {"name": "Triggered By", "value": "${{ github.actor }}", "inline": false},
                {"name": "Commit/PR", "value": "${{ github.event.pull_request.title }}", "inline": false},
                {"name": "Actions Log", "value": "[Link to Action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true}
              ],
              "footer": {
                "text": "${{ steps.current-time.outputs.formattedTime }} KST"
              }
            }]
        uses: Ilshidur/action-discord@0.4.0
        with:
          args: "v2 CI 파이프라인 실행 중 오류가 발생했습니다. 로그를 확인해주세요. <@&${{ secrets.DISCORD_ROLE_FRONTEND_ONCALL }}> "

  # 3. Dev 배포 (dev 브랜치 Merge 시)
  deploy-dev:
    needs: check-changes
    if: github.event.pull_request.merged == true && github.base_ref == 'develop'
    uses: ./.github/workflows/deploy-dev.yml
    with:
      environment: dev
      image_uri: 624234316947.dkr.ecr.ap-northeast-2.amazonaws.com/frontend:dev-pr-${{ github.event.pull_request.head.sha }}
      instance_tag_name: "Environment"
      instance_tag_value: "dev"
      pr_number: ${{ github.event.pull_request.number }}
      pr_title: ${{ github.event.pull_request.title }}
      base_ref: ${{ github.base_ref }}
      actor: ${{ github.actor }}
      run_id: ${{ github.run_id }}
      repository: ${{ github.repository }}
    secrets: inherit

  # 4. Staging 배포 (main 브랜치 Merge 시)
  deploy-staging:
    needs: check-changes
    if: github.event.pull_request.merged == true && github.base_ref == 'main'
    uses: ./.github/workflows/deploy-asg-rolling.yml
    with:
      environment: staging
      image_uri: 624234316947.dkr.ecr.ap-northeast-2.amazonaws.com/frontend:staging-pr-${{ github.event.pull_request.head.sha }}
      asg_name: "raisedeveloper-frontend-staging-asg"
      lt_id: "lt-00ea919f9826532d6"
      pr_number: ${{ github.event.pull_request.number }}
      pr_title: ${{ github.event.pull_request.title }}
      base_ref: ${{ github.base_ref }}
      actor: ${{ github.actor }}
      run_id: ${{ github.run_id }}
      repository: ${{ github.repository }}
    secrets: inherit

  # 5. Production 빌드 및 배포 (별도 잡)
  # FE는 환경변수 때문에 Staging 이미지를 Prod로 승격 불가. 새로 빌드해야 함.
  build-and-deploy-production:
    needs: [deploy-staging, check-changes]
    if: github.event.pull_request.merged == true && github.base_ref == 'main' && needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm & Node 설정 (빌드 캐시용 아님, Sentry CLI 및 스크립트 실행용)
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.13.0"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Turbo 빌드 캐시 복원  
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      # Next.js 빌드 캐시 복원
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.{js,ts,jsx,tsx}', 'packages/**/*.{js,ts,jsx,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # 시멘틱 버전 태그 생성
      - name: Create Semantic Version Tag
        id: create_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 --match "v*.*.*" 2>/dev/null || echo "v0.0.0")
          echo "Current Latest Tag: $LATEST_TAG"

          VERSION=${LATEST_TAG#v}
          MAJOR=$(echo $VERSION | cut -d. -f1)
          MINOR=$(echo $VERSION | cut -d. -f2)
          PATCH=$(echo $VERSION | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"

          echo "New Version to be created: $NEW_VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a $NEW_VERSION -m "Production Release $NEW_VERSION
          PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.number }}
          Commit: ${{ github.sha }}
          Actor: ${{ github.actor }}"
          git push origin $NEW_VERSION
          
          echo "DEPLOY_TAG=$NEW_VERSION" >> $GITHUB_ENV
          echo "Tag created: $NEW_VERSION"

      # Production용 env
      - name: Create web env for Production
        shell: bash
        run: |
          echo "${{ secrets.WEB_ENV_PROD_V2 }}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_RELEASE=raisedev-web@prod-${{ env.DEPLOY_TAG }}" >> "$GITHUB_ENV"
          echo "SENTRY_PROJECT=raisedev-prod" >> "$GITHUB_ENV"

      # AWS & ECR 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # # Sentry Release (Prod)
      # - name: Setup Node & Sentry
      #   uses: actions/setup-node@v5
      #   with: { node-version: "24.13.0" }
      # - run: npm install -g @sentry/cli
      # - name: Create Sentry Release
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      #     NEXT_PUBLIC_RELEASE: raisedev-web@prod-${{ env.DEPLOY_TAG }}
      #   run: |
      #     sentry-cli releases new "$NEXT_PUBLIC_RELEASE"
      #     sentry-cli releases set-commits "$NEXT_PUBLIC_RELEASE" --auto || true

      # Production Build
      - name: Build for Production
        run: pnpm turbo build --filter=web

      # 모토레포 경로 처리
      - name: Bundle Artifacts for Production
        working-directory: apps/web
        run: |
          STANDALONE_ROOT=".next/standalone"

          if [ -d "$STANDALONE_ROOT/1-team-one-fe/apps/web" ]; then
            APP_DIR="$STANDALONE_ROOT/1-team-one-fe/apps/web"
          elif [ -d "$STANDALONE_ROOT/apps/web" ]; then
            APP_DIR="$STANDALONE_ROOT/apps/web"
          else
            echo "ERROR: Cannot find standalone app directory"
            ls -la $STANDALONE_ROOT
            exit 1
          fi

          mkdir -p $APP_DIR/.next
          cp -r .next/static $APP_DIR/.next/
          cp -r public $APP_DIR/
          
          # Dockerfile 복사 (루트에 있는걸 standalone 안으로)
          cp ../../Dockerfile $STANDALONE_ROOT/Dockerfile

      # Production 이미지 빌드 및 푸시
      - name: Build and Push Prod Image
        id: build-prod
        working-directory: apps/web/.next/standalone
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ env.DEPLOY_TAG }}
        run: |
          # 시멘틱 버전 태그로 빌드
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$TAG
          
          # latest 태그도 업데이트
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$TAG $ECR_REGISTRY/$ECR_REPOSITORY:production-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:production-latest
          
          echo "FINAL_IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_OUTPUT

      # # 7. Sentry Finalize
      # - name: Finalize Sentry Release
      #   env:
      #     SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      #     SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      #     NEXT_PUBLIC_RELEASE: raisedev-web@prod-${{ env.DEPLOY_TAG }}
      #   run: sentry-cli releases finalize "$NEXT_PUBLIC_RELEASE"

    # 6. 실제 Prod 배포 (outputs 전달)
    outputs:
      image_uri: ${{ steps.build-prod.outputs.FINAL_IMAGE_URI }}
      deploy_tag: ${{ env.DEPLOY_TAG }}

  # 7. Production 배포 실행
  trigger-deploy-prod:
    needs: build-and-deploy-production
    uses: ./.github/workflows/deploy-asg-rolling.yml
    with:
      environment: production
      image_uri: ${{ needs.build-and-deploy-production.outputs.image_uri }}
      asg_name: "raisedeveloper-frontend-production-asg"
      lt_id: "lt-040a2416fc6894c75"
      pr_number: ${{ github.event.pull_request.number }}
      pr_title: ${{ github.event.pull_request.title }}
      base_ref: ${{ github.base_ref }}
      actor: ${{ github.actor }}
      run_id: ${{ github.run_id }}
      repository: ${{ github.repository }}
    secrets: inherit